<!doctype html>
<!-- Source of public/og-image.jpg. Screenshot at 1200x630 after editing. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Heebo; src: url(heebo-hebrew-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: Heebo, sans-serif; background: #0b1b2e; color: #fff; overflow: hidden; position: relative;
    background-image: linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 48px 48px; }
  .photo { position: absolute; inset-block: 0; left: 0; width: 470px; background: url(hero-panel-960.webp) center/cover; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, #0b1b2e); }
  .text { position: absolute; right: 64px; top: 70px; width: 640px; }
  .label { display: inline-block; color: #ffc928; font-weight: 700; font-size: 26px; border: 2px solid #ffc928; border-radius: 8px; padding: 4px 14px; }
  h1 { font-size: 78px; line-height: 1.05; font-weight: 900; margin-top: 28px; }
  h1 span { color: #ffc928; display: block; }
  p { font-size: 26px; color: #ffffffcc; margin-top: 22px; }
  .phone { margin-top: 34px; display: inline-block; background: #ffc928; color: #0b1b2e; font-weight: 900; font-size: 40px; padding: 10px 28px; border-radius: 14px; direction: ltr; }
  .wire { position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: #ffc928; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="text">
    <div class="label">חשמלאי מוסמך ובודק חשמל</div>
    <h1>אסף לוין<span>חשמלאי בגוש דן</span></h1>
    <p>תקלות דחופות 24/7 · לוחות חשמל · תאורה · עמדות טעינה</p>
    <div class="phone">050-000-0000</div>
  </div>
  <div class="wire"></div>
</body>
</html>
